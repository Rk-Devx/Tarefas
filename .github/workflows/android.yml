name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Copiar o app web para o projeto mobile
        run: mkdir -p www && cp ../index.html www/index.html
      - name: Criar projeto Android
        run: npx cap add android
      - name: Gerar icones
        run: npx @capacitor/assets generate --android
        continue-on-error: true
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tarefas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tarefas-android-apk
          path: mobile/Tarefas.apk
      - name: Anexar a release (quando houver tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/Tarefas.apk
